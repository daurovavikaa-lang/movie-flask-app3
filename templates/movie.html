<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ movie.title }} — Подбор фильмов</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 15px; }
        a.back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: underline;
        }
        .meta { color: #555; margin-bottom: 12px; }
        .description { line-height: 1.6; font-size: 16px; }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Вернуться к подбору</a>

    <h1>{{ movie.title }}</h1>
    <div class="meta">
        <strong>Год:</strong> {{ movie.year }} •
        <strong>Жанр:</strong> {{ movie.genre }} •
        <strong>Режиссёр:</strong> {{ movie.director }} •
        <strong>Страна:</strong> {{ movie.country }} •
        <strong>Рейтинг:</strong> {{ movie.rating }}
    </div>
    <div class="description">
        {{ movie.description }}
    </div>
</body>
</html>
